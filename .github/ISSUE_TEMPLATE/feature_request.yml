name: Feature request
description: Suggest something ChocolateBar should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation. Skip the solution for now — focus on what's missing or painful.
      placeholder: "When I have 12 menu bar apps running, the strip overflows and I can't see the rightmost ones."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would solve it for you?
      description: Your ideal solution. Rough is fine — sketches and analogies welcome.
      placeholder: "A scrollable strip, or a way to pin the 5 icons I use most so they always stay visible."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: Optional. Helps us understand the gap.

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use it regularly
        - I'd stop using ChocolateBar without it
    validations:
      required: true
